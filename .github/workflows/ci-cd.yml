name: CI/CD — Build & Deploy to VPS

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: kssindustri
  COMPOSE_FILE: docker-compose.yml

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Code quality — CodeQL analysis
  # ────────────────────────────────────────────────────────────
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: typescript
      - uses: github/codeql-action/analyze@v3

  # ────────────────────────────────────────────────────────────
  # 2. Build Docker image & push to GitHub Container Registry
  # ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # 3. Deploy to VPS via SSH
  # ────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [analyze, build]
    environment: production
    steps:
      - name: Join tailnet for deploy
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-kssindustri-deploy
          ping: ${{ secrets.VPS_TAILSCALE_HOST }}

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Trust VPS host key on tailnet
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_TAILSCALE_HOST: ${{ secrets.VPS_TAILSCALE_HOST }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$VPS_PORT" "$VPS_TAILSCALE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS over Tailscale SSH path
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_TAILSCALE_HOST: ${{ secrets.VPS_TAILSCALE_HOST }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
        run: |
          set -euo pipefail

          APP_DIR_Q=$(printf '%q' "$VPS_APP_DIR")
          IMAGE_Q=$(printf '%q' "$IMAGE")
          API_BASE_URL_Q=$(printf '%q' "$VITE_API_BASE_URL")
          TURNSTILE_SITE_KEY_Q=$(printf '%q' "$TURNSTILE_SITE_KEY")
          GHCR_USER_Q=$(printf '%q' "$GHCR_USER")
          GHCR_PAT_Q=$(printf '%q' "$GHCR_PAT")

          ssh -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_TAILSCALE_HOST" <<REMOTE_EOF
          set -euo pipefail

          APP_DIR=$APP_DIR_Q
          IMAGE=$IMAGE_Q
          API_BASE_URL=$API_BASE_URL_Q
          TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY_Q
          GHCR_USER=$GHCR_USER_Q
          GHCR_PAT=$GHCR_PAT_Q

          echo "\$GHCR_PAT" | docker login ghcr.io -u "\$GHCR_USER" --password-stdin
          docker pull "\$IMAGE"

          mkdir -p "\$APP_DIR" || { echo "Cannot create \$APP_DIR; pre-create it on the server with correct ownership"; exit 1; }
          cd "\$APP_DIR"

          cat > docker-compose.yml <<'COMPOSE_EOF'
          services:
            vuefront:
              image: IMAGE_PLACEHOLDER
              container_name: vuefront
              restart: unless-stopped
              environment:
                VITE_API_BASE_URL: "API_BASE_URL_PLACEHOLDER"
                TURNSTILE_SITE_KEY: "TURNSTILE_SITE_KEY_PLACEHOLDER"
              ports:
                - "127.0.0.1:3090:3090"
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost:3090/"]
                interval: 30s
                timeout: 3s
                start_period: 5s
                retries: 3
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
          COMPOSE_EOF

          sed -i "s|IMAGE_PLACEHOLDER|\${IMAGE}|g" docker-compose.yml
          sed -i "s|API_BASE_URL_PLACEHOLDER|\${API_BASE_URL}|g" docker-compose.yml
          sed -i "s|TURNSTILE_SITE_KEY_PLACEHOLDER|\${TURNSTILE_SITE_KEY}|g" docker-compose.yml

          docker compose pull
          docker compose up -d --force-recreate --remove-orphans
          docker image prune -af --filter "until=168h"

          echo "Deployment complete"
          REMOTE_EOF
